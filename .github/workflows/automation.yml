name: Cloud Automation Pipeline

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          uses-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: /home/runner/work/_temp/Library
          key: ${{ runner.os }}-r-packages-${{ hashFiles('scripts/data_pull.R') }}
          restore-keys: |
            ${{ runner.os }}-r-packages-

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Linux System Libraries
        run: sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R Packages
        run: |
          install.packages("pacman")
          pacman::p_load(httr, jsonlite, tidyr, lubridate, dplyr, stringr, zoo, hms, readr, padr, ggplot2, plotly, shiny, reactable, kableExtra, scales, xts, dygraphs, rvest, bsicons, knitr, rmarkdown, DT)
        shell: Rscript {0}

      - name: Run Data Pull Script
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
        run: Rscript scripts/data_pull.R

      - name: Render Quarto Dashboard
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: index.qmd

      - name: Commit and Push Updates
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*
          git add index.html
          git commit -m "Automated cloud update" || echo "No changes to commit"
          git push
